# After each cmux nightly: check every setup in setups.json against that nightly's settings schema
# and agent-pane style tokens (`review.py --setups-compat`), so a listed look that the nightly would
# refuse at install shows up the day it breaks, not when someone installs it. It reports and gates
# nothing: the report goes to the job summary, and to one open issue while a listed setup would not
# install (a comment only when the report changes; closed when every setup installs again).
name: Setups vs the cmux nightly

on:
  schedule:
    # The nightly-next train runs at 17 past every sixth hour; this reads the newest appcast after.
    - cron: "50 */6 * * *"
  workflow_dispatch:
    inputs:
      cmux_ref:
        description: A cmux commit to check against instead of the newest nightly
        required: false
        default: ""
  repository_dispatch:
    types: [cmux-nightly]

permissions:
  contents: read
  issues: write

concurrency:
  group: setups-compat
  cancel-in-progress: false

jobs:
  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the validator's one dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r review/requirements.txt

      - name: Check every listed setup against the nightly
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMUX_REF: ${{ inputs.cmux_ref || github.event.client_payload.sha || '' }}
        run: |
          if [ -n "$CMUX_REF" ] && ! printf '%s' "$CMUX_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "cmux_ref must be a 40-character commit sha"; exit 1
          fi
          args=(--root . --setups-compat --out "$RUNNER_TEMP/report.md" --quiet)
          [ -n "$CMUX_REF" ] && args+=(--cmux-ref "$CMUX_REF")
          code=0
          "$RUNNER_TEMP/venv/bin/python" review/review.py "${args[@]}" || code=$?
          # The report without the run link, so an unchanged report is not posted again.
          echo "digest=$(sha256sum "$RUNNER_TEMP/report.md" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          printf '\n<sub>[Run](%s/%s/actions/runs/%s) of the validator on main (%s).</sub>\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report on the tracking issue
        if: steps.check.outputs.code == '0' || steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
          DIGEST: ${{ steps.check.outputs.digest }}
        run: |
          title="Listed setups vs the cmux nightly"
          marker="<!-- setups-compat-digest: $DIGEST -->"
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq \
            "[.[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"$title\")][0].number // empty")
          printf '%s\n' "$marker" | cat - "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/post.md"
          body=$(jq -Rs '{body: .}' "$RUNNER_TEMP/post.md")
          if [ "$CODE" = 0 ]; then
            if [ -n "$issue" ]; then
              echo "$body" | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" --input - > /dev/null
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -f state=closed > /dev/null
              echo "every setup installs again: closed #$issue"
            fi
            exit 0
          fi
          if [ -z "$issue" ]; then
            jq -Rs --arg title "$title" '{title: $title, body: .}' "$RUNNER_TEMP/post.md" \
              | gh api -X POST "repos/$GITHUB_REPOSITORY/issues" --input - --jq '"opened #\(.number)"'
            exit 0
          fi
          last=$( { gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq .body;
                    gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" --jq '.[].body'; } \
                  | grep -o '<!-- setups-compat-digest: [0-9a-f]* -->' | tail -n 1)
          if [ "$last" = "$marker" ]; then
            echo "the report is unchanged since the last post on #$issue"
          else
            echo "$body" | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" --input - > /dev/null
            echo "posted the new report on #$issue"
          fi

      - name: Red when a listed setup would not install
        if: steps.check.outputs.code != '0'
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: |
          [ "$CODE" = 2 ] && echo "::error::could not read the cmux nightly (see the summary)"
          [ "$CODE" = 1 ] && echo "::error::a listed setup would not install on the nightly (see the summary)"
          exit 1
